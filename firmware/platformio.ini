; Сборка: pio run            (прошивка по USB: pio run -t upload)
; OTA после первой прошивки: pio run -e d1_mini_ota -t upload
[platformio]
src_dir = GyverTwink_v1.3

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
; EEManager 1.2, EncButton 1.15, SimplePortal 1.0 (AlexGyver, MIT) лежат в lib/
lib_deps =
    fastled/FastLED@3.4.0

[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
; адрес гирлянды или gyvertwink-XXXXXX.local
upload_port = 192.168.50.214
