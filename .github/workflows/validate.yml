name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-26.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  firmware:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install platformio
      - run: pio run -d firmware -e d1_mini
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/.pio/build/d1_mini/firmware.bin
